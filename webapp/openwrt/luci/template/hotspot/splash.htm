<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotZone WiFi - Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,.15);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo svg { width: 64px; height: 64px; color: #2563eb; }
        h1 { color: #1f2937; font-size: 28px; font-weight: 700; margin-bottom: 8px; text-align: center; }
        .subtitle { color: #6b7280; text-align: center; margin-bottom: 32px; }
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #374151; font-weight: 500; margin-bottom: 8px; font-size: 14px; }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: border-color .2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn:active { background: #1e40af; }
        .btn:disabled { background: #93c5fd; cursor: not-allowed; }
        .plans {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
        }
        .plans h3 { color: #374151; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
        .plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .plan-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .plan-name { font-weight: 600; color: #1f2937; font-size: 13px; }
        .plan-price { color: #2563eb; font-weight: 700; font-size: 18px; margin: 4px 0; }
        .plan-details { color: #64748b; font-size: 11px; line-height: 1.5; }
        .footer { text-align: center; margin-top: 24px; color: #9ca3af; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
            </svg>
        </div>
        <h1>HotZone WiFi</h1>
        <p class="subtitle">Enter your voucher code to connect</p>
        
        <% if error then %>
        <div class="error"><%= error %></div>
        <% end %>
        
        <form action="<%= luci.dispatcher.build_url('hotspot', 'login') %>" method="post">
            <input type="hidden" name="mac" value="<%= client_mac %>">
            <div class="form-group">
                <label for="code">Voucher Code</label>
                <input type="text" id="code" name="code" placeholder="T-XXXX-XXXX" required autocomplete="off" autocapitalize="characters">
            </div>
            <button type="submit" class="btn">Connect</button>
        </form>
        
        <div class="plans">
            <h3>Available Plans</h3>
            <div class="plan-grid">
                <div class="plan-card">
                    <div class="plan-name">Trial</div>
                    <div class="plan-price">Free</div>
                    <div class="plan-details">30 min • 2 Mbps</div>
                </div>
                <div class="plan-card">
                    <div class="plan-name">Hourly</div>
                    <div class="plan-price">৳20</div>
                    <div class="plan-details">1 hr • 5 Mbps</div>
                </div>
                <div class="plan-card">
                    <div class="plan-name">Daily</div>
                    <div class="plan-price">৳50</div>
                    <div class="plan-details">24 hr • 10 Mbps</div>
                </div>
                <div class="plan-card">
                    <div class="plan-name">Weekly</div>
                    <div class="plan-price">৳200</div>
                    <div class="plan-details">7 days • 5 Mbps</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            Need a voucher? Contact admin or purchase online.
        </div>
    </div>
    
    <script>
        // Auto-format voucher code input
        document.getElementById('code').addEventListener('input', function(e) {
            let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (v.length > 2 && v.length <= 7) v = v.slice(0,2) + '-' + v.slice(2);
            if (v.length > 7) v = v.slice(0,7) + '-' + v.slice(7,11);
            e.target.value = v.slice(0,13);
        });
    </script>
</body>
</html>
