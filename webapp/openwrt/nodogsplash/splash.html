<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HotZone WiFi</title>
<style>
:root {
  --ink: #070b14;
  --surface: #0c1322;
  --surface-2: #111a2e;
  --border: #1c2740;
  --text: #e6edf7;
  --muted: #7d8aa3;
  --cyan: #22d3ee;
  --amber: #f59e0b;
  --danger: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--ink);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 36px 32px 28px;
  width: 100%;
  max-width: 400px;
}
.brand { text-align: center; margin-bottom: 26px; }
.brand .mark {
  display: inline-flex;
  width: 44px; height: 44px;
  align-items: center; justify-content: center;
  border: 1px solid rgba(34, 211, 238, .35);
  border-radius: 10px;
  background: rgba(34, 211, 238, .08);
  margin-bottom: 12px;
}
.brand .mark svg { width: 22px; height: 22px; stroke: var(--cyan); }
.brand h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.brand p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.gatewaymessage, .error {
  background: rgba(248, 113, 113, .08);
  border: 1px solid rgba(248, 113, 113, .35);
  color: var(--danger);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 18px;
  text-align: center;
}
label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 8px;
}
input[type="text"] {
  width: 100%;
  padding: 13px 14px;
  background: var(--ink);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .12em;
  text-align: center;
  text-transform: uppercase;
}
input[type="text"]:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(34, 211, 238, .15);
}
input[type="text"]::placeholder { color: #3d4a63; letter-spacing: .1em; }
button {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  background: var(--cyan);
  color: #04222a;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
button:hover { filter: brightness(1.08); }
button:active { filter: brightness(.95); }
.plans { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border); }
.plans h3 {
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 12px;
}
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.plan {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.plan .name { font-size: 12px; color: var(--text); font-weight: 600; }
.plan .detail { font-size: 11px; color: var(--muted); margin-top: 3px; }
.plan .price { font-size: 14px; font-weight: 700; color: var(--amber); white-space: nowrap; }
.buy { text-align: center; margin-top: 18px; }
.buy a { color: var(--cyan); font-size: 13px; font-weight: 600; text-decoration: none; }
.buy a:hover { text-decoration: underline; }
.footer { text-align: center; margin-top: 16px; color: #4b5872; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <h1>HotZone</h1>
    <p>Voucher WiFi · Tarif Hotspot</p>
  </div>

  $error_msg

  <form method="GET" action="$authaction">
    <input type="hidden" name="tok" value="$tok">
    <input type="hidden" name="redir" value="$redir">
    <label for="voucher">Voucher code</label>
    <input type="text" id="voucher" name="password" placeholder="T-XXXX-XXXX"
           maxlength="15" required autocomplete="off" autocorrect="off"
           autocapitalize="characters" spellcheck="false">
    <button type="submit">Connect</button>
  </form>

  <div class="plans">
    <h3>Available plans</h3>
    <div class="plan-grid" id="plan-grid">
      <div class="plan"><div><div class="name">Trial</div><div class="detail">30 min · 2 Mbps</div></div><div class="price">Free</div></div>
      <div class="plan"><div><div class="name">Hourly</div><div class="detail">1 hr · 5 Mbps</div></div><div class="price">&#2547;20</div></div>
      <div class="plan"><div><div class="name">Daily</div><div class="detail">24 hr · 10 Mbps</div></div><div class="price">&#2547;50</div></div>
      <div class="plan"><div><div class="name">Weekly</div><div class="detail">7 days · 5 Mbps</div></div><div class="price">&#2547;200</div></div>
    </div>
  </div>

  <div class="buy">
    <a href="https://hotzone-delta.vercel.app/?ip=$clientip&amp;mac=$clientmac">Buy voucher online</a>
  </div>
  <div class="footer">Lost the code? Check your payment SMS or contact the admin.</div>
</div>

<script>
(function () {
  var input = document.getElementById('voucher');
  input.addEventListener('input', function () {
    var v = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.length > 2 && v.length <= 7) v = v.slice(0, 2) + '-' + v.slice(2);
    if (v.length > 7) v = v.slice(0, 7) + '-' + v.slice(7, 11);
    input.value = v.slice(0, 13);
  });

  function fmtDuration(s) {
    if (s < 3600) return Math.floor(s / 60) + ' min';
    if (s < 86400) { var h = Math.floor(s / 3600); return h + (h >= 2 ? ' hrs' : ' hr'); }
    var d = Math.floor(s / 86400);
    return d + (d >= 2 ? ' days' : ' day');
  }
  function fmtSpeed(k) {
    return k >= 1024 ? (k / 1024).toString().replace(/\.0$/, '') + ' Mbps' : k + ' Kbps';
  }

  fetch('https://hotzone-delta.vercel.app/api/plans')
    .then(function (r) { return r.json(); })
    .then(function (plans) {
      var grid = document.getElementById('plan-grid');
      grid.innerHTML = '';
      plans.filter(function (p) { return p.active !== 0; }).forEach(function (p) {
        var el = document.createElement('div');
        el.className = 'plan';
        var left = document.createElement('div');
        var name = document.createElement('div');
        name.className = 'name';
        name.textContent = p.name;
        var detail = document.createElement('div');
        detail.className = 'detail';
        detail.textContent = fmtDuration(p.duration_seconds) + ' · ' + fmtSpeed(p.download_kbps);
        left.appendChild(name);
        left.appendChild(detail);
        var price = document.createElement('div');
        price.className = 'price';
        price.textContent = p.price_bdt > 0 ? '৳' + p.price_bdt : 'Free';
        el.appendChild(left);
        el.appendChild(price);
        grid.appendChild(el);
      });
    })
    .catch(function () { /* keep static fallback */ });
})();
</script>
</body>
</html>
