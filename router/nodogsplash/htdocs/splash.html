<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>Tarif Hotspot</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #e2e8f0;
}
.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 16px;
  padding: 40px 32px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
}
.logo {
  text-align: center;
  margin-bottom: 32px;
}
.logo h1 {
  font-size: 28px;
  font-weight: 700;
  color: #38bdf8;
  letter-spacing: -0.5px;
}
.logo p {
  color: #94a3b8;
  font-size: 14px;
  margin-top: 4px;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #94a3b8;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-group input {
  width: 100%;
  padding: 14px 16px;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 10px;
  color: #f1f5f9;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 2px;
  text-align: center;
  text-transform: uppercase;
  transition: border-color 0.2s;
}
.form-group input:focus {
  outline: none;
  border-color: #38bdf8;
  box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
}
.form-group input::placeholder {
  color: #475569;
  font-weight: 400;
  letter-spacing: 1px;
}
.btn {
  width: 100%;
  padding: 14px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: #1d4ed8; }
.btn:active { transform: scale(0.98); }
.error {
  background: #451a2a;
  border: 1px solid #dc2626;
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 20px;
  color: #fca5a5;
  font-size: 14px;
  text-align: center;
}
.plans {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid #334155;
}
.plans h3 {
  font-size: 13px;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  text-align: center;
}
.plan-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.plan-item {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 10px 12px;
  text-align: center;
}
.plan-item .name {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 500;
}
.plan-item .detail {
  font-size: 11px;
  color: #64748b;
  margin-top: 2px;
}
.buy-link {
  text-align: center;
  margin-top: 20px;
}
.buy-link a {
  color: #38bdf8;
  font-size: 14px;
  text-decoration: none;
  font-weight: 500;
}
.buy-link a:hover { text-decoration: underline; }
.footer {
  text-align: center;
  margin-top: 24px;
  font-size: 11px;
  color: #475569;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Tarif</h1>
    <p>Internet Hotspot</p>
  </div>

  <form method="GET" action="$authaction">
    <input type="hidden" name="tok" value="$tok">
    <input type="hidden" name="redir" value="$redir">

    $error_msg

    <div class="form-group">
      <label>Voucher Code</label>
      <input type="text" name="password" placeholder="XXXX-XXXX" maxlength="15" required autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    </div>

    <button type="submit" class="btn">Connect</button>
  </form>

  <div class="plans">
    <h3>Available Plans</h3>
    <div class="plan-grid">
      <div class="plan-item">
        <div class="name">Hourly</div>
        <div class="detail">1h / 5 Mbps</div>
      </div>
      <div class="plan-item">
        <div class="name">Daily</div>
        <div class="detail">24h / 10 Mbps</div>
      </div>
      <div class="plan-item">
        <div class="name">Weekly</div>
        <div class="detail">7d / 5 Mbps</div>
      </div>
      <div class="plan-item">
        <div class="name">Monthly</div>
        <div class="detail">30d / 10 Mbps</div>
      </div>
    </div>
  </div>

  <div class="buy-link">
    <a href="http://192.168.1.1:3000">Buy Voucher Online</a>
  </div>

  <div class="footer">
    Enter your voucher code to connect
  </div>
</div>
</body>
</html>
